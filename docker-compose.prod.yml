version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: resite_gis_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - COPERNICUS_CLIENT_ID=${COPERNICUS_CLIENT_ID:-}
      - COPERNICUS_CLIENT_SECRET=${COPERNICUS_CLIENT_SECRET:-}
      - OVERPASS_BASE_URL=${OVERPASS_BASE_URL:-https://overpass-api.de/api/interpreter}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Optional local Nginx reverse-proxy / static web server for single-server AWS deploy
  web:
    image: nginx:alpine
    container_name: resite_gis_web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
